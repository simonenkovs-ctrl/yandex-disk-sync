name: Build Android APK

on:
  push:
    branches: [ master, main, android ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk YandexDiskSync-v1.4.0.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk YandexDiskSync-v1.4.0.apk
          fi
          ls -la YandexDiskSync-v1.4.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yandex-disk-sync-apk
          path: |
            YandexDiskSync-v1.4.0.apk
            **/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: YandexDiskSync-v1.4.0.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
