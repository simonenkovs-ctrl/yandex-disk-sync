name: Build Android APK

on:
  push:
    branches: [ master, main, android ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          {
            echo "keystore.storePassword=${KEYSTORE_STORE_PASSWORD}"
            echo "keystore.keyAlias=${KEYSTORE_KEY_ALIAS}"
            echo "keystore.keyPassword=${KEYSTORE_KEY_PASSWORD}"
          } >> android/local.properties
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Restore release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > android/app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build APKs
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          else
            echo "::warning::Key store secrets are not configured - building debug APK only"
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: List generated APKs
        run: |
          find . -name "*.apk" -ls

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yandex-disk-sync-apk
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 30
